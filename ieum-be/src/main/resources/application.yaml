spring:
  application:
    name: ieum-be
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  # Railway/Render·Vercel 프록시 뒤에서 https와 접속 IP를 바르게 읽는다
  forward-headers-strategy: native
  servlet:
    session:
      # ponytail: 메모리 세션이라 재배포하면 로그아웃된다. 인스턴스를 2개 이상 띄우면 spring-session-jdbc로
      timeout: 7d
      cookie:
        same-site: lax
