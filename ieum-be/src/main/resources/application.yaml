spring:
  application:
    name: ieum-be
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # DB 오류 메시지에 행 값(입력 원문·전화번호)이 실려 로그에 남지 않게 한다 (FR-11.2)
        logServerErrorDetail: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  # Railway/Render·Vercel 프록시 뒤에서 https와 접속 IP를 바르게 읽는다
  forward-headers-strategy: native
  servlet:
    session:
      # ponytail: 메모리 세션이라 재배포하면 로그아웃된다. 인스턴스를 2개 이상 띄우면 spring-session-jdbc로
      timeout: 7d
      cookie:
        same-site: lax

# API 문서: /swagger-ui.html (스펙 /v3/api-docs). 저장소에는 docs/openapi.json으로 커밋된다
springdoc:
  override-with-generic-response: false   # 409 핸들러(ApiErrors)를 모든 API 응답에 끼워 넣지 않는다
  writer-with-order-by-keys: true          # docs/openapi.json diff가 매번 같은 순서로 나오게
  writer-with-default-pretty-printer: true
