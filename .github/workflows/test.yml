name: test

# PR마다 + main에 들어갈 때 백엔드 테스트를 돌린다.
# 테스트는 Testcontainers로 실제 Postgres를 띄운다 (ubuntu 러너에 Docker 기본 포함). .env 없이 돈다.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ieum-be
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test
      - name: 실패하면 테스트 리포트 올리기 (요청·응답 본문 포함)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: ieum-be/build/reports/tests/test
